# For a server that already runs nginx. Save as
# /etc/nginx/sites-available/murphy-signal-lab, link it into sites-enabled, then:
#
#   sudo apt install apache2-utils                      # for htpasswd, once
#   sudo htpasswd -c /etc/nginx/murphy.htpasswd ucema   # asks for the shared password
#   sudo certbot --nginx -d murphyslab.namilabs.ai          # adds HTTPS to this block
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS is required: the browser only signs the OKX demo requests on HTTPS or localhost.

server {
    listen 80;
    server_name murphyslab.namilabs.ai;

    root /var/www/murphy-signal-lab;
    index index.html;

    auth_basic "Murphy Signal Lab";
    auth_basic_user_file /etc/nginx/murphy.htpasswd;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
